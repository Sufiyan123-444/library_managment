{% extends 'base.html' %}
{% block content %}
<div class="p-4 p-md-5 mb-3 bg-light rounded-3 border">
    <h2 class="fw-bold">Library Management Dashboard</h2>
    <p class="text-muted mb-4">Manage books, students, issue books, and return books.</p>
    <div class="d-grid gap-2 d-md-flex">
        <a href="{{ url_for('books') }}" class="btn btn-primary">Book Management</a>
        <a href="{{ url_for('students') }}" class="btn btn-success">Student Management</a>
        <a href="{{ url_for('issue') }}" class="btn btn-info text-white">Issue Book</a>
        <a href="{{ url_for('return_page') }}" class="btn btn-warning">Return Book</a>
    </div>
</div>
{% endblock %}
