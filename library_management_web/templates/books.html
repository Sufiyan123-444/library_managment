{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Book Management</h3>

<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <form method="post" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Book ID</label>
                <input class="form-control" name="book_id" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Title</label>
                <input class="form-control" name="title" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Author</label>
                <input class="form-control" name="author" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Quantity</label>
                <input class="form-control" name="quantity" type="number" min="0" required>
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit">Add Book</button>
            </div>
        </form>
    </div>
</div>

<form method="get" class="row g-2 mb-3">
    <div class="col-md-5">
        <input class="form-control" name="search" value="{{ search }}" placeholder="Search by ID, title, author">
    </div>
    <div class="col-md-2">
        <button class="btn btn-outline-primary w-100" type="submit">Search</button>
    </div>
    <div class="col-md-2">
        <a class="btn btn-outline-secondary w-100" href="{{ url_for('books') }}">Clear</a>
    </div>
</form>

<div class="table-responsive card shadow-sm">
    <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th>Book ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for row in books %}
            <tr>
                <td>{{ row['book_id'] }}</td>
                <td>{{ row['title'] }}</td>
                <td>{{ row['author'] }}</td>
                <td>{{ row['quantity'] }}</td>
                <td>
                    <form method="post" action="{{ url_for('delete_book_route', book_id=row['book_id']) }}" onsubmit="return confirm('Delete this book?')">
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="5" class="text-center text-muted">No books found</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
