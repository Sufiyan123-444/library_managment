{% extends 'base.html' %}
{% block content %}
<h3 class="mb-3">Student Management</h3>

<div class="card mb-4 shadow-sm">
    <div class="card-body">
        <form method="post" class="row g-3">
            <div class="col-md-4">
                <label class="form-label">Student ID</label>
                <input class="form-control" name="student_id" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Name</label>
                <input class="form-control" name="name" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Department</label>
                <input class="form-control" name="department" required>
            </div>
            <div class="col-12">
                <button class="btn btn-success" type="submit">Add Student</button>
            </div>
        </form>
    </div>
</div>

<div class="table-responsive card shadow-sm">
    <table class="table table-striped table-hover mb-0">
        <thead class="table-dark">
            <tr>
                <th>Student ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for row in students %}
            <tr>
                <td>{{ row['student_id'] }}</td>
                <td>{{ row['name'] }}</td>
                <td>{{ row['department'] }}</td>
                <td>
                    <form method="post" action="{{ url_for('delete_student_route', student_id=row['student_id']) }}" onsubmit="return confirm('Delete this student?')">
                        <button class="btn btn-sm btn-danger">Delete</button>
                    </form>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="4" class="text-center text-muted">No students found</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
